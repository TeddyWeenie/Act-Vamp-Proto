<!doctype html>
<html>
  <body style="margin: 0; background: #888">
    <canvas id="c" width="1000" height="1000"></canvas>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      const px = Number(new URLSearchParams(location.search).get("px") ?? 1000); document.getElementById("c").width = px; document.getElementById("c").height = px;
      const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      r.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x888888);
      const g = await new GLTFLoader().loadAsync('/assets/models/townhouse.glb');
      g.scene.traverse((n) => {
        if (n.isMesh) n.material = new THREE.MeshBasicMaterial({ map: n.material.map });
      });
      scene.add(g.scene);
      g.scene.updateMatrixWorld(true);
      const b = new THREE.Box3().setFromObject(g.scene);
      const s = b.getSize(new THREE.Vector3());
      const c = b.getCenter(new THREE.Vector3());
      const cam = new THREE.OrthographicCamera(-s.x / 2, s.x / 2, s.y / 2, -s.y / 2, 0.01, 10);
      const side = new URLSearchParams(location.search).get('side');
      if (side) {
        cam.left = -s.z / 2;
        cam.right = s.z / 2;
        cam.updateProjectionMatrix();
        cam.position.set(c.x + 3, c.y, c.z);
      } else cam.position.set(c.x, c.y, c.z + 3);
      cam.lookAt(c);
      r.render(scene, cam);
      // 계단 모양 재기: 문 가운데에서 정면 끝부터 안쪽으로 가며 아래로 선을 쏘아 바닥 높이를 잰다(건물 높이가 1).
      const ray = new THREE.Raycaster();
      const profile = [];
      for (let i = 0; i <= 60; i++) {
        const fromFront = (i / 60) * 0.3;
        ray.set(new THREE.Vector3(c.x, b.min.y + 0.2 * s.y, b.max.z - fromFront * s.z), new THREE.Vector3(0, -1, 0));
        const hit = ray.intersectObject(g.scene, true)[0];
        profile.push([+fromFront.toFixed(3), hit ? +((hit.point.y - b.min.y) / s.y).toFixed(3) : 0]);
      }
      window.__done = {
        profile, size: s.toArray(), min: b.min.toArray(), max: b.max.toArray() };
    </script>
  </body>
</html>
